services:
  nginx:
    build: ./docker/nginx
    ports:
      - '8031:80'
    depends_on:
      - php
    volumes:
      - ./www:/opt/work
    container_name: site_phppa_nginx
  php:
    build: ./docker/php
    volumes:
      - ./www:/opt/work
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      PHP_IDE_CONFIG: "serverName=xdebug-docker"
    container_name: site_phppa_php
