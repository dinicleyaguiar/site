server {
    listen 80;
    server_name localhost;

    location / {
        root /opt/work/;
        try_files $uri $uri/ /index.php?cod=$uri&$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/work/$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }
}
